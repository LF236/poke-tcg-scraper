services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-poke_tcg}
      POSTGRES_USER: ${DB_USER:-poke}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poke}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
